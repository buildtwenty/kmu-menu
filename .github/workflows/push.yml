name: 아침 메뉴 웹 푸시

# ── 실행 시각 ─────────────────────────────────────────────────────────────
# 정시 발송(평일 08:00 KST)은 GitHub cron이 아니라 외부 타이머(cron-job.org)가
# workflow_dispatch API를 호출해 시작한다. GitHub의 schedule은 '그 시각에 대기열에
# 넣는 것'이라 실측 2.5~3.5시간씩 밀려(08:00 예약 → 10:25~11:39 도착) 아침 알림엔 못 쓴다.
# 아래 schedule은 외부 타이머가 죽었을 때의 보험: 08:30 KST(UTC 23:30)에 걸어 두고,
# 그날 이미 성공한 외부/수동 발송이 있으면 건너뛴다(중복 알림 방지).
on:
  schedule:
    - cron: "30 23 * * 0-4"   # UTC 23:30 일~목 = KST 08:30 월~금
  workflow_dispatch:           # 외부 타이머(cron-job.org) + Actions 탭 수동 실행

permissions:
  contents: read
  actions: read   # 오늘 이미 성공한 발송 run이 있는지 조회(보험 실행의 중복 방지)

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      # 보험(schedule) 실행일 때만: 오늘(KST) workflow_dispatch로 성공한 발송이 있으면 건너뜀.
      # 외부 타이머가 08:00에 정상 발송했으면 여기서 끝난다. 수동 실행은 이 검사를 거치지 않는다.
      - name: 오늘 이미 발송됐으면 건너뜀
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          START=$(python3 -c "from datetime import datetime, timedelta, timezone; \
            k = datetime.now(timezone(timedelta(hours=9))).replace(hour=0, minute=0, second=0, microsecond=0); \
            print(k.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          N=$(gh run list --workflow push.yml --event workflow_dispatch --status success \
                --created ">=$START" --json databaseId --jq 'length')
          echo "오늘(KST) 성공한 외부/수동 발송: ${N}건 (기준 ${START} 이후)"
          if [ "${N}" -gt 0 ]; then
            echo "이미 발송됨 → 보험 실행 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 파이썬 설치
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        if: steps.dedupe.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 오늘(KST) 메뉴 요약을 만들어 Supabase 구독자 전원에게 발송.
      # 오늘 메뉴가 없으면(공휴일 등) 스크립트가 스스로 건너뛰고 정상 종료한다.
      # 만료 구독(404/410)은 발송 중에 테이블에서 정리된다.
      - name: 웹 푸시 발송
        if: steps.dedupe.outputs.skip != 'true'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/send_push.py
